[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bridge-evidence"
version = "0.2.0"
description = "Evidence-backed bridge inspection report extraction and recovery"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "python-docx>=1.1,<2",
  "jsonschema>=4.26,<5",
  "Pillow>=13,<14",
  "olefile>=0.47,<1",
  "pypdfium2>=4.30,<6",
  "pydantic>=2.8,<3",
  "rapidfuzz>=3.9,<4",
  "scipy>=1.14,<2",
  "networkx>=3.3,<4",
  "langgraph>=1,<2",
  "openai>=1.40,<3",
  "httpx>=0.27,<1",
  "instructor>=1.6,<3",
  "structlog>=24,<27",
]

[project.optional-dependencies]
contest-cpu = [
  "tokenizers>=0.22,<0.23",
  "Jinja2>=3.1.6,<4",
]
dev = [
  "pytest>=8,<10",
  "hypothesis>=6,<7",
  "tokenizers>=0.22,<0.23",
  "Jinja2>=3.1.6,<4",
]

[project.scripts]
bridge-evidence = "bridge_evidence.cli:main"

[project.urls]
Homepage = "https://github.com/eust-w/cityagent-public"
Issues = "https://github.com/eust-w/cityagent-public/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"bridge_evidence.resources" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests", "experiments"]
pythonpath = [".", "src", "tests"]
