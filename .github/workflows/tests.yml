name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install development dependencies
        run: |
          python -m pip install uv==0.12.6
          uv sync --locked --extra dev
      - name: CPU regression tests
        run: uv run --locked --extra dev python -m pytest -q
      - name: Offline synthetic demo
        run: uv run --locked --extra dev python examples/offline_demo.py --output-dir "$RUNNER_TEMP/cityagent-demo"
      - name: Build and test the installed wheel outside the checkout
        run: |
          uv build --wheel --out-dir "$RUNNER_TEMP/wheels"
          uv pip install --python .venv/bin/python --reinstall --no-deps "$RUNNER_TEMP"/wheels/*.whl
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          cd "$RUNNER_TEMP"
          python -c "from bridge_evidence.config import load_settings, load_prompts; assert load_settings().llm_mode == 'off'; assert load_prompts()['fact_system']"
          bridge-evidence --help
